# OpsCat Community Edition — self-hosted deployment.
# In the public opscat.io repo this file is published as `docker-compose.yml`.
# Set OPSCAT_DOMAIN (and the mail settings if you want alert e-mails) in a .env
# file next to this compose file; Caddy obtains TLS certificates automatically.
#
# ─────────────────────────────────────────────────────────────────────────────
# UPGRADING FROM A VERSION BEFORE 2026-08-19? TWO STEPS, AND THE SECOND MATTERS.
#
# Raw log LINES now live in ClickHouse. Everything else — events, cases,
# incidents, users, settings — is still PostgreSQL and is untouched.
#
#   1. Put a password in .env, or `docker compose up -d` refuses to start:
#        CLICKHOUSE_PASSWORD=$(openssl rand -hex 24)
#      It fails loudly on purpose. An install that comes up without its log
#      store reports itself as a crash-loop, which is harder to diagnose than
#      a one-line error.
#
#   2. Bring your existing log lines across, AFTER the stack is up:
#        docker compose exec -T app node scripts/migrate-logs-to-clickhouse.js --dry-run
#        docker compose exec -T app node scripts/migrate-logs-to-clickhouse.js
#      Reads switch to ClickHouse the moment the app restarts, so without this
#      your history is still in PostgreSQL and simply stops being displayed.
#      The script deletes nothing, verifies the row counts agree, and refuses
#      to run twice.
#
# Want to stay on PostgreSQL for log lines? Add the opt-out override:
#   docker compose -f docker-compose.yml -f docker-compose.postgres-logs.yml up -d
# It keeps the lines in PostgreSQL and stops the container from being started at
# all. Still tested on every pull request — not the default is not deprecated.
# ─────────────────────────────────────────────────────────────────────────────
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.community
      # Build identity for /api/version. Set them to record which commit an image
      # was built from:
      #   OPSCAT_COMMIT=$(git rev-parse --short=7 HEAD) docker compose up -d --build
      # Left unset the answer is "unknown", which is honest rather than wrong.
      args:
        OPSCAT_COMMIT: ${OPSCAT_COMMIT:-unknown}
        OPSCAT_BUILT_AT: ${OPSCAT_BUILT_AT:-}
    # No host port mapping on purpose: the app is only reachable through Caddy
    # on the internal compose network.
    expose:
      - "3000"
    environment:
      # Listed because compose passes ONLY whitelisted variables — the precedent
      # is OPSCAT_GRID_PUBLISHED, which worked under `npm start` and was
      # silently unset in Docker.
      #
      # PostgreSQL is THE engine (decision D6) — the community edition moves with
      # the cloud one rather than keeping a second SQL dialect alive forever. So
      # `db` is part of the stack, not a profile, and `app` waits for it.
      #
      # DATABASE_URL is REQUIRED: there is no engine switch and no fallback —
      # the app refuses to start without it. Backups are `pg_dump`, not a file
      # copy; see OPERATIONS.md § Data & backups.
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-opscat}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opscat}}
      #
      # ClickHouse holds the raw log LINES; everything transactional stays in
      # `db` above. It is part of the stack here, the same as in the cloud —
      # about 14x less disk per line and log search an order of magnitude
      # faster (docs/BENCHMARKS.md § 5).
      #
      # THE PRICE IS MEMORY AND IT IS STATED RATHER THAN HIDDEN: the stack ran
      # at ~400 MB with Postgres alone and SETTLES at ~870 MB with ClickHouse
      # beside it — measured after days of traffic, not seconds after boot,
      # which is a 150 MB difference because ClickHouse grows into its caches
      # (docs/BENCHMARKS.md § 5.7.4). Both databases are capped by `mem_limit`
      # below — 1g and 1.5g — so the worst case is bounded rather than a
      # surprise on a small box.
      #
      # UPGRADING AN EXISTING INSTALL? Read the note at the top of this file.
      # This is a breaking change: `docker compose up -d` will now refuse
      # without CLICKHOUSE_PASSWORD, and your existing log lines need one
      # command to come across.
      #
      # Too small a box for it? `docker-compose.postgres-logs.yml` is the
      # supported opt-out — it keeps log lines in PostgreSQL AND stops the
      # container from starting, which an empty CLICKHOUSE_URL alone does not
      # (the service is still declared, so compose starts it anyway). That path
      # is not deprecated and not untested — CI runs the same 40 assertions
      # against both stores on every pull request — it is simply not default.
      - CLICKHOUSE_URL=${CLICKHOUSE_URL-http://clickhouse:8123}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-opscat}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-opscat}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env — e.g. openssl rand -hex 24}
      - OPSCAT_BASE_URL=${OPSCAT_BASE_URL:-http://localhost}
      # The managed syslog endpoint. Listed here so the variable is not silently
      # dropped by compose (the OPSCAT_GRID_PUBLISHED precedent), but left EMPTY
      # on purpose: a self-hosted stack has no gateway unless its operator runs
      # one, and an empty value means the mode is simply not offered rather than
      # printing a hostname that resolves to nothing. Point it at your own
      # `collector/Dockerfile` image started with OPSCAT_GATEWAY=1 to enable it.
      - OPSCAT_SYSLOG_HOST=${OPSCAT_SYSLOG_HOST:-}
      - OPSCAT_SYSLOG_PORT=${OPSCAT_SYSLOG_PORT:-6514}
      - OPSCAT_SYSLOG_PEN=${OPSCAT_SYSLOG_PEN:-0}
      # The WireGuard tunnel (stage 3). Same story as the managed endpoint above:
      # listed so compose does not silently drop them, empty by default because
      # a self-hosted stack has no tunnel gateway until its operator runs one.
      # `collector/Dockerfile` with --build-arg WITH_WIREGUARD=1 is that gateway.
      - OPSCAT_TUNNEL_NET=${OPSCAT_TUNNEL_NET:-}
      - OPSCAT_TUNNEL_ENDPOINT=${OPSCAT_TUNNEL_ENDPOINT:-}
      - OPSCAT_TUNNEL_PUBKEY=${OPSCAT_TUNNEL_PUBKEY:-}
      - OPSCAT_TUNNEL_GATEWAY_KEY=${OPSCAT_TUNNEL_GATEWAY_KEY:-}
      - OPSCAT_ADMIN_EMAIL=${OPSCAT_ADMIN_EMAIL:-}
      - OPSCAT_ALERT_FROM=${OPSCAT_ALERT_FROM:-}
      - OPSCAT_AUTH_FROM=${OPSCAT_AUTH_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-0}
      - OPSCAT_SECRET=${OPSCAT_SECRET:-}
      - OPSCAT_PROBE_CITY=${OPSCAT_PROBE_CITY:-Local}
      - OPSCAT_PROBE_CC=${OPSCAT_PROBE_CC:-XX}
      # Resolver for blocklist (DNSBL) lookups — the `unbound` sidecar below by
      # default. The lists refuse queries arriving through a large shared
      # resolver (1.1.1.1, 8.8.8.8, and a hoster's own count as such), so a
      # recursive resolver of our own is what makes their answers trustworthy.
      # Override to a comma-separated list, or to empty for the host resolver.
      - OPSCAT_REPUTATION_DNS=${OPSCAT_REPUTATION_DNS:-unbound}
      # CE only: permit webhook targets on private/LAN addresses (ignored in cloud)
      - OPSCAT_ALLOW_PRIVATE_TARGETS=${OPSCAT_ALLOW_PRIVATE_TARGETS:-0}
      # VAPID `sub` for Web Push — a real mailbox the push services can reach
      - OPSCAT_PUSH_CONTACT=${OPSCAT_PUSH_CONTACT:-}
      - OPSCAT_GRID_HOST=${OPSCAT_GRID_HOST:-radar.opscat.io}
      - OPSCAT_STATUS_HOST=${OPSCAT_STATUS_HOST:-}
      - OPSCAT_GRID_PUBLISHED=${OPSCAT_GRID_PUBLISHED:-0}
      # Build identity fallbacks for a deployment that is neither this image nor a
      # git checkout. Normally BOTH stay empty: the image's own build-info.json is
      # what /api/version reads, and it wins over these on purpose (a stale value
      # in .env would outlive every rebuild).
      - OPSCAT_COMMIT=${OPSCAT_COMMIT:-}
      - OPSCAT_BUILD_INFO=${OPSCAT_BUILD_INFO:-}
      - OPSCAT_EDITION=community
      # GitHub login (community feature) — create an OAuth app on GitHub with
      # callback <OPSCAT_BASE_URL>/api/auth/github/callback
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # --- OpsCat Bridge — LiveKit sidecar (see the livekit service below).
      # The feature stays hidden until all of URL/key/secret are set.
      - OPSCAT_LIVEKIT_URL=${OPSCAT_LIVEKIT_URL:-}
      - OPSCAT_LIVEKIT_INTERNAL_URL=${OPSCAT_LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      - OPSCAT_LIVEKIT_API_KEY=${OPSCAT_LIVEKIT_API_KEY:-}
      - OPSCAT_LIVEKIT_API_SECRET=${OPSCAT_LIVEKIT_API_SECRET:-}
    volumes:
      - opscat_data:/data
    # The app cannot boot before the database accepts connections, and
    # `service_healthy` (not just `service_started`) is the difference: Postgres
    # runs its own init on first start, so the container is up for several
    # seconds before it listens. Without this, `restart: always` turns that
    # window into a crash-loop that reads as a slow start.
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: always

  # PostgreSQL — the target of docs/POSTGRES-MIGRATION-PLAN.md.
  #
  # It runs NOW, before anything queries it, and that is deliberate. The adapter
  # (Phase 5) cannot be written against a database that does not exist, and the
  # plan's highest-value test — PREPARE every one of the ~700 statements against
  # an empty schema — needs nothing except a reachable Postgres. Standing this up
  # early is free: an unused container changes no behaviour and reverts in one PR.
  #
  # `mem_limit` is not optional on this host. It has 3.7 GB and NO SWAP (see the
  # plan § 0a), so an unbounded Postgres and an OOM-killed app are the same event.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-opscat}
      - POSTGRES_USER=${POSTGRES_USER:-opscat}
      # REQUIRED now, and the reasoning inverted with the profile. It used to be
      # empty on purpose: compose interpolates the whole file even for a service
      # it will not start, so `${VAR:?}` would have aborted an ordinary `up` over
      # a container nobody asked for. `db` is part of the stack now, so an empty
      # password is not an honest failure — it is an install that comes up
      # without a database and reports it as a crash-loop.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — e.g. openssl rand -hex 24}
    volumes:
      - opscat_pgdata:/var/lib/postgresql/data
    # `pg_isready` is what `depends_on: service_healthy` waits for. Without it
    # the app starts against a socket that is not listening yet, `restart: always`
    # restarts it, and a crash-loop reads as a slow start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opscat} -d ${POSTGRES_DB:-opscat}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    restart: always

  # Recursive resolver for blocklist lookups only. Not published to any host
  # port — an open recursive resolver is a DNS-amplification reflector, and
  # unbound.conf refuses everything outside the compose network.
  #
  # It exists because DNSBLs refuse queries arriving through a large shared
  # resolver: on this host every Spamhaus zone answered 127.255.255.254 ("use
  # your own resolver") via systemd-resolved, while a direct query to Spamhaus'
  # authoritative servers from the same machine answered the canary correctly.
  # The app does NOT depend_on it: if the resolver is down, Reputation degrades
  # to "unknown" (which it reports honestly) rather than holding up the app.
  unbound:
    build: ./unbound
    expose:
      - "53"
    restart: always
    healthcheck:
      # Can it actually recurse? A resolver that answers from an empty cache but
      # cannot reach the roots would otherwise look healthy.
      test: ["CMD", "drill", "-Q", "@127.0.0.1", "dbltest.com.dbl.spamhaus.org"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # OpsCat Bridge media plane: the LiveKit SFU. Opt-in via compose profile so
  # a plain `docker compose up` stays unchanged:
  #   docker compose --profile bridge up -d
  # Set in .env: OPSCAT_LIVEKIT_URL=wss://bridge.<your-domain>,
  # OPSCAT_LIVEKIT_API_KEY=opscat, OPSCAT_LIVEKIT_API_SECRET=<random>, and add
  # a DNS record for bridge.<your-domain> (the Caddyfile already proxies it). Edit
  # the webhook URL in livekit.yaml. Open UDP 50100-50200 + TCP 7881 in your
  # firewall. Full walkthrough: docs/BRIDGE.md.
  livekit:
    image: livekit/livekit-server:v1.13.5
    profiles: ["bridge"]
    command: --config /etc/livekit.yaml
    environment:
      - 'LIVEKIT_KEYS=${OPSCAT_LIVEKIT_API_KEY:-opscat}: ${OPSCAT_LIVEKIT_API_SECRET:-}'
    volumes:
      # livekit.community.yaml is published as livekit.yaml in the public repo
      - ./livekit.yaml:/etc/livekit.yaml:ro
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "50100-50200:50100-50200/udp"
    restart: always

  # ClickHouse — the log LINE store. Part of the stack, same as in the cloud.
  # See the CLICKHOUSE_URL comment on `app` for what it costs and how to run
  # without it on a box too small to spare the memory.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DB:-opscat}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-opscat}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env — e.g. openssl rand -hex 24}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=0
    volumes:
      # ClickHouse's defaults assume a machine far bigger than a self-hosted box
      # — mark_cache alone defaults to 5 GiB. This file caps the four that
      # matter and records which two knobs broke the server when they were tried.
      - ./ch-config/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - opscat_chdata:/var/lib/clickhouse
    expose:
      - "8123"
    # 1.5g, not 1g. The original figure was set while this was an idle
    # experiment; the first real 7-day log search on production was refused for
    # exceeding it. ch-config/low-memory.xml keeps ClickHouse's own limit below
    # this one on purpose, so it refuses a query rather than being OOM-killed.
    mem_limit: 1.5g
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      # `/ping` needs no credentials; an authenticated query does, and a
      # healthcheck without them is refused forever. See docker-compose.yml.
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/ping' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - OPSCAT_DOMAIN=${OPSCAT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: always

volumes:
  opscat_pgdata:
  opscat_chdata:
  opscat_data:
  caddy_data:
  caddy_config:
