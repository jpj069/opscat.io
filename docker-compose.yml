# OpsCat Community Edition — self-hosted deployment.
# In the public opscat.io repo this file is published as `docker-compose.yml`.
# Set OPSCAT_DOMAIN (and the mail settings if you want alert e-mails) in a .env
# file next to this compose file; Caddy obtains TLS certificates automatically.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.community
      # Build identity for /api/version. Set them to record which commit an image
      # was built from:
      #   OPSCAT_COMMIT=$(git rev-parse --short=7 HEAD) docker compose up -d --build
      # Left unset the answer is "unknown", which is honest rather than wrong.
      args:
        OPSCAT_COMMIT: ${OPSCAT_COMMIT:-unknown}
        OPSCAT_BUILT_AT: ${OPSCAT_BUILT_AT:-}
    # No host port mapping on purpose: the app is only reachable through Caddy
    # on the internal compose network.
    expose:
      - "3000"
    environment:
      # Unused until Phase 5 wires the adapter. Listed now because compose passes
      # ONLY whitelisted variables — the precedent is OPSCAT_GRID_PUBLISHED,
      # which worked under `npm start` and was silently unset in Docker.
      - DATABASE_URL=${DATABASE_URL:-}
      - OPSCAT_BASE_URL=${OPSCAT_BASE_URL:-http://localhost}
      - OPSCAT_ADMIN_EMAIL=${OPSCAT_ADMIN_EMAIL:-}
      - OPSCAT_ALERT_FROM=${OPSCAT_ALERT_FROM:-}
      - OPSCAT_AUTH_FROM=${OPSCAT_AUTH_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-0}
      - OPSCAT_SECRET=${OPSCAT_SECRET:-}
      - OPSCAT_PROBE_CITY=${OPSCAT_PROBE_CITY:-Local}
      - OPSCAT_PROBE_CC=${OPSCAT_PROBE_CC:-XX}
      # Resolver for blocklist (DNSBL) lookups — the `unbound` sidecar below by
      # default. The lists refuse queries arriving through a large shared
      # resolver (1.1.1.1, 8.8.8.8, and a hoster's own count as such), so a
      # recursive resolver of our own is what makes their answers trustworthy.
      # Override to a comma-separated list, or to empty for the host resolver.
      - OPSCAT_REPUTATION_DNS=${OPSCAT_REPUTATION_DNS:-unbound}
      # CE only: permit webhook targets on private/LAN addresses (ignored in cloud)
      - OPSCAT_ALLOW_PRIVATE_TARGETS=${OPSCAT_ALLOW_PRIVATE_TARGETS:-0}
      # VAPID `sub` for Web Push — a real mailbox the push services can reach
      - OPSCAT_PUSH_CONTACT=${OPSCAT_PUSH_CONTACT:-}
      - OPSCAT_GRID_HOST=${OPSCAT_GRID_HOST:-radar.opscat.io}
      - OPSCAT_STATUS_HOST=${OPSCAT_STATUS_HOST:-}
      - OPSCAT_GRID_PUBLISHED=${OPSCAT_GRID_PUBLISHED:-0}
      # Build identity fallbacks for a deployment that is neither this image nor a
      # git checkout. Normally BOTH stay empty: the image's own build-info.json is
      # what /api/version reads, and it wins over these on purpose (a stale value
      # in .env would outlive every rebuild).
      - OPSCAT_COMMIT=${OPSCAT_COMMIT:-}
      - OPSCAT_BUILD_INFO=${OPSCAT_BUILD_INFO:-}
      - OPSCAT_EDITION=community
      # GitHub login (community feature) — create an OAuth app on GitHub with
      # callback <OPSCAT_BASE_URL>/api/auth/github/callback
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # --- OpsCat Bridge — LiveKit sidecar (see the livekit service below).
      # The feature stays hidden until all of URL/key/secret are set.
      - OPSCAT_LIVEKIT_URL=${OPSCAT_LIVEKIT_URL:-}
      - OPSCAT_LIVEKIT_INTERNAL_URL=${OPSCAT_LIVEKIT_INTERNAL_URL:-http://livekit:7880}
      - OPSCAT_LIVEKIT_API_KEY=${OPSCAT_LIVEKIT_API_KEY:-}
      - OPSCAT_LIVEKIT_API_SECRET=${OPSCAT_LIVEKIT_API_SECRET:-}
    volumes:
      - opscat_data:/data
    restart: always

  # PostgreSQL — the target of docs/POSTGRES-MIGRATION-PLAN.md.
  #
  # It runs NOW, before anything queries it, and that is deliberate. The adapter
  # (Phase 5) cannot be written against a database that does not exist, and the
  # plan's highest-value test — PREPARE every one of the ~700 statements against
  # an empty schema — needs nothing except a reachable Postgres. Standing this up
  # early is free: an unused container changes no behaviour and reverts in one PR.
  #
  # `mem_limit` is not optional on this host. It has 3.7 GB and NO SWAP (see the
  # plan § 0a), so an unbounded Postgres and an OOM-killed app are the same event.
  db:
    image: postgres:16-alpine
    # OPT-IN, and that is the safety property. A profiled service is not started
    # by a plain `docker compose up`, so the production deploy — which runs
    # exactly that over SSH — is untouched by this file existing. Start it with
    #   docker compose --profile postgres up -d db
    profiles: [postgres]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-opscat}
      - POSTGRES_USER=${POSTGRES_USER:-opscat}
      # Empty default ON PURPOSE, and it is subtle: compose interpolates the
      # entire file even for a service it will not start, so `${VAR:?...}` here
      # would abort `docker compose up` in production over a container nobody
      # asked for. Left empty, postgres itself refuses to start — the honest
      # failure, and only for whoever opted into the profile.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
    volumes:
      - opscat_pgdata:/var/lib/postgresql/data
    # `pg_isready` is what `depends_on: service_healthy` waits for. Without it
    # the app starts against a socket that is not listening yet, `restart: always`
    # restarts it, and a crash-loop reads as a slow start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opscat} -d ${POSTGRES_DB:-opscat}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 1g
    restart: always

  # Recursive resolver for blocklist lookups only. Not published to any host
  # port — an open recursive resolver is a DNS-amplification reflector, and
  # unbound.conf refuses everything outside the compose network.
  #
  # It exists because DNSBLs refuse queries arriving through a large shared
  # resolver: on this host every Spamhaus zone answered 127.255.255.254 ("use
  # your own resolver") via systemd-resolved, while a direct query to Spamhaus'
  # authoritative servers from the same machine answered the canary correctly.
  # The app does NOT depend_on it: if the resolver is down, Reputation degrades
  # to "unknown" (which it reports honestly) rather than holding up the app.
  unbound:
    build: ./unbound
    expose:
      - "53"
    restart: always
    healthcheck:
      # Can it actually recurse? A resolver that answers from an empty cache but
      # cannot reach the roots would otherwise look healthy.
      test: ["CMD", "drill", "-Q", "@127.0.0.1", "dbltest.com.dbl.spamhaus.org"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # OpsCat Bridge media plane: the LiveKit SFU. Opt-in via compose profile so
  # a plain `docker compose up` stays unchanged:
  #   docker compose --profile bridge up -d
  # Set in .env: OPSCAT_LIVEKIT_URL=wss://bridge.<your-domain>,
  # OPSCAT_LIVEKIT_API_KEY=opscat, OPSCAT_LIVEKIT_API_SECRET=<random>, and add
  # a DNS record for bridge.<your-domain> (the Caddyfile already proxies it). Edit
  # the webhook URL in livekit.yaml. Open UDP 50100-50200 + TCP 7881 in your
  # firewall. Full walkthrough: docs/BRIDGE.md.
  livekit:
    image: livekit/livekit-server:v1.13.5
    profiles: ["bridge"]
    command: --config /etc/livekit.yaml
    environment:
      - 'LIVEKIT_KEYS=${OPSCAT_LIVEKIT_API_KEY:-opscat}: ${OPSCAT_LIVEKIT_API_SECRET:-}'
    volumes:
      # livekit.community.yaml is published as livekit.yaml in the public repo
      - ./livekit.yaml:/etc/livekit.yaml:ro
    expose:
      - "7880"
    ports:
      - "7881:7881"
      - "50100-50200:50100-50200/udp"
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - OPSCAT_DOMAIN=${OPSCAT_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: always

volumes:
  opscat_pgdata:
  opscat_data:
  caddy_data:
  caddy_config:
