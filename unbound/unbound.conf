# Minimal recursive resolver for OpsCat's blocklist lookups.
#
# Reachable ONLY from the compose network — never published to a host port. An
# open recursive resolver is a DNS-amplification reflector, so access-control is
# the one setting here that must not be loosened.
server:
  verbosity: 0
  interface: 0.0.0.0
  port: 53
  do-ip4: yes
  do-ip6: no                  # the compose network is v4-only
  do-udp: yes
  do-tcp: yes

  # Only the private compose network may query. Everything else is refused.
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow

  # Hardening — this is a resolver on the public internet's doorstep.
  hide-identity: yes
  hide-version: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-referral-path: yes
  qname-minimisation: yes
  rrset-roundrobin: yes

  # DNSSEC validation against the root anchor baked in at build time.
  auto-trust-anchor-file: "/etc/unbound/root.key"

  # Sized for a handful of assets on a 2-vCPU box, not for a campus.
  num-threads: 1
  msg-cache-size: 8m
  rrset-cache-size: 16m
  cache-min-ttl: 60
  # DNSBL answers move on the order of hours; a short ceiling keeps a delisting
  # from staying invisible for a day, without re-querying on every run.
  cache-max-ttl: 900
  cache-max-negative-ttl: 300

  # Blocklist zones answer from 127.0.0.0/8, which unbound strips by default as
  # rebinding protection. Without these two lines every lookup comes back empty
  # and every asset reads as clean — the exact failure this whole feature is
  # built to avoid.
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  unblock-lan-zones: yes
  insecure-lan-zones: yes

  # Do NOT add 127.0.0.0/8 to private-address (see above) — that is deliberate.

remote-control:
  control-enable: no
